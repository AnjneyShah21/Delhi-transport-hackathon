services:
  - type: web
    name: delhi-ki-public
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && make gtfs
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DTS_GTFSRT_API_KEY
        sync: false
